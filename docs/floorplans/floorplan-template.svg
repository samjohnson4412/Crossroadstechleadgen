<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Campus Sentinel floor plan template — one file per building level.
  Open in Inkscape (free: inkscape.org). See INKSCAPE_GUIDE.md.
  Page: 17 x 11 in (tabloid, landscape).
-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   width="17in" height="11in" viewBox="0 0 1700 1100"
   version="1.1">
  <title>Building – Level</title>
  <sodipodi:namedview
     id="view" pagecolor="#ffffff" bordercolor="#666666" showgrid="false"
     inkscape:snap-global="true" inkscape:snap-nodes="true" inkscape:snap-path="true"
     inkscape:snap-intersection-paths="true" inkscape:snap-perpendicular="true"
     inkscape:document-units="in" />

  <!-- Layers are listed bottom to top. -->
  <g inkscape:groupmode="layer" id="layer-scan" inkscape:label="Scan (put the scanned PDF here, then lock)" sodipodi:insensitive="false" opacity="0.4" />

  <g inkscape:groupmode="layer" id="layer-dividers" inkscape:label="Dividers (only to split an open area into two rooms - not a real wall)"
     style="fill:none;stroke:#3d8bfd;stroke-width:2;stroke-dasharray:6,4" />

  <g inkscape:groupmode="layer" id="layer-walls" inkscape:label="Walls"
     style="fill:none;stroke:#000000;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter" />

  <g inkscape:groupmode="layer" id="layer-doors" inkscape:label="Doors (short red line drawn over the wall where each door is)"
     style="fill:none;stroke:#e53935;stroke-width:8;stroke-linecap:butt" />

  <g inkscape:groupmode="layer" id="layer-labels" inkscape:label="Labels (room number / name, placed inside each room)"
     style="font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#000000;text-anchor:middle" />

  <g inkscape:groupmode="layer" id="layer-example" inkscape:label="EXAMPLE – delete this layer">
    <path d="M 100,100 H 700 V 300 H 100 Z M 400,100 V 300" style="fill:none;stroke:#000;stroke-width:4;stroke-linecap:square" />
    <path d="M 550,100 V 300" style="fill:none;stroke:#3d8bfd;stroke-width:2;stroke-dasharray:6,4" />
    <text x="475" y="205" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;text-anchor:middle">Lobby</text>
    <text x="625" y="205" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;text-anchor:middle">Hallway</text>
    <path d="M 230,300 H 270" style="fill:none;stroke:#e53935;stroke-width:8;stroke-linecap:butt" />
    <text x="250" y="322" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;text-anchor:middle;fill:#e53935">door</text>
    <text x="250" y="205" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;text-anchor:middle">E105</text>
    <text x="250" y="230" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;text-anchor:middle;fill:#555">Mrs. Smith – 3rd grade</text>
    <text x="100" y="340" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#999">Example: every area enclosed by walls is a room. Solid walls (black, Walls layer); door = short red line over the wall (Doors layer); label inside each room (Labels layer); blue dashed divider splits the open Lobby/Hallway (Dividers layer).</text>
  </g>
</svg>
